name: Release

# Builds desktop binaries and publishes GitHub Release.
# Triggered automatically after Release Trigger creates tag v*.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: kueri-desktop-darwin-universal
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: kueri-desktop-linux-amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact: kueri-desktop-windows-amd64.exe

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: api/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web assets
        working-directory: web
        env:
          VITE_DESKTOP_BUILD: "1"
        run: |
          npm ci
          npm run build

      - name: Prepare desktop embed
        shell: bash
        run: |
          rm -rf api/internal/desktop/webdist
          mkdir -p api/internal/desktop/webdist
          cp -R web/dist/. api/internal/desktop/webdist/

      - name: Build desktop binary
        working-directory: api
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          LDFLAGS="-s -w -X github.com/tetradatateknologi/kueri/api/internal/version.Version=${VERSION} -X github.com/tetradatateknologi/kueri/api/internal/version.Mode=desktop"
          CGO_ENABLED=0 go build -tags desktop -ldflags "$LDFLAGS" -o "../dist/release/${{ matrix.artifact }}" ./cmd/desktop

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/release/${{ matrix.artifact }}

  publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      - name: Generate manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/gen-release-manifest.py dist/release --version "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
